# Daily results + tracker autosettle + NFL data refresh. Runs on GitHub's servers: the laptop does not need to be on.
name: results
on:
  schedule:
    - cron: "7 11 * * *"     # 07:07 EDT (06:07 EST after Nov 1)
  workflow_dispatch:
    inputs:
      date: { description: "YYYY-MM-DD (blank = yesterday ET)", required: false }
permissions: { contents: write }
concurrency: { group: writer-actions, cancel-in-progress: false }
jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLAUDE_FIRE_URL: ${{ secrets.CLAUDE_FIRE_URL }}
      CLAUDE_FIRE_TOKEN: ${{ secrets.CLAUDE_FIRE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas==2.2.3 numpy==2.1.3 scipy==1.14.1
      - name: Pull box scores (ESPN NBA, MLB statsapi)
        run: python engine/cloud/results.py ${{ inputs.date }}
      - name: Autosettle tracker rows
        run: python engine/cloud/autosettle.py ${{ inputs.date }} && python engine/tracker.py | tail -25
      - name: Refresh NFL play-by-play (Mon/Tue/Fri)
        run: |
          case "$(TZ=America/New_York date +%u)" in 1|2|5) python engine/nfl/fetch_nfl.py || echo "nflverse refresh failed (non-fatal)";; *) echo "skip";; esac
      - name: Commit
        env: { COMMIT_MSG: "bot: results + autosettle" }
        run: .github/scripts/commit.sh data status Record engine/data/nfl
      - name: Fire Claude morning audit (optional)
        if: ${{ env.CLAUDE_FIRE_URL != '' }}
        run: |
          curl -sS -X POST "$CLAUDE_FIRE_URL" -H "Authorization: Bearer $CLAUDE_FIRE_TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" -H "content-type: application/json" \
            -d '{"text":"results.yml finished; data/results and status/actions.json are updated."}' || true
