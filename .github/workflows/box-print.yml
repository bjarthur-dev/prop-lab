# Manual: print NBA (API-NBA) and NHL (official API) box scores for a date into the run log. Changes nothing in the repo.
name: box-print
on:
  workflow_dispatch:
    inputs: { date: { description: "YYYY-MM-DD", required: true } }
jobs:
  print:
    runs-on: ubuntu-latest
    env: { SPORTS_API_KEY_1: "${{ secrets.SPORTS_API_KEY_1 }}", SPORTS_API_KEY_2: "${{ secrets.SPORTS_API_KEY_2 }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas==2.2.3
      - run: python engine/cloud/nhl_box.py ${{ inputs.date }} || true
      - run: python engine/cloud/nba_box.py ${{ inputs.date }} --check || true
